<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">

<body>
  <div class="container">
    <div class="page-title">第 2 页</div>

    <div class="player-card">
      <div class="disc-icon" id="disc-icon">

          <span id="time-current">0:00</span>
          <span id="time-total">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button class="btn-play" id="btn-play" aria-label="播放">

    <div class="footer-hint">青葵有声书</div>
